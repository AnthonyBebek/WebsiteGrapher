[supervisord]
nodaemon=true
logfile=/dev/null

[program:tor]
command=/usr/bin/tor
autostart=true
autorestart=true

[program:client]
command=bash -c "sleep 10 && python3 DockerClient.py"
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0