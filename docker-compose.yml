services:

  dev-db:
    image: mysql:8.0
    restart: always
    container_name: dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${db_password}
      MYSQL_DATABASE: ${db_name}
      MYSQL_USER: ${db_user}
      MYSQL_PASSWORD: ${db_password}
    ports:  
      - "${db_port}:3306"
    volumes:
      - db_data:/var/lib/mysql    

  dev-api:
    build: .
    container_name: dev-api
    depends_on:
      - dev-db
    environment:
      DB_HOST: ${db_host}
      DB_PORT: ${db_port}
      DB_USER: ${db_user}
      DB_PASSWORD: ${db_password} 
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  db_data:
  api_data:
